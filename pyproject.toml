[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notraffic-automation-assignment"
version = "1.0.0"
description = "Python pytest + Playwright automation for the NoTraffic home assignment"
requires-python = ">=3.10"
dependencies = [
    "playwright==1.60.0",
    "pytest==8.3.4",
]

[tool.setuptools.packages.find]
include = ["notraffic*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "api: API-level validation tests",
    "ui: UI tests through the browser",
    "e2e: end-to-end workflow tests",
    "known_issue: documented product bug that is intentionally skipped",
]
